# yaml-language-server: $schema=../schemas/fleet-v1.schema.json
apiVersion: myrmidons/v1
kind: Fleet
metadata:
  name: issue8-justfile
  host: hermes
  description: >-
    Multi-repo E2E fleet for Issue #8 — add justfile recipes for AchaeanFleet,
    Proteus, Mnemosyne, Hephaestus
spec:
  agents:
    # Planner (1 agent, read-only workspace)
    - ref: hermes/issue8-planner
    # Loop workers (4 agents, read-write workspace)
    - ref: hermes/issue8-loop-achaean-fleet
    - ref: hermes/issue8-loop-proteus
    - ref: hermes/issue8-loop-mnemosyne
    - ref: hermes/issue8-loop-hephaestus
    # Per-repo shippers (4 agents, git-only + read-only workspace)
    - ref: hermes/issue8-ship-achaean-fleet
    - ref: hermes/issue8-ship-proteus
    - ref: hermes/issue8-ship-mnemosyne
    - ref: hermes/issue8-ship-hephaestus
    # Final Odysseus shipper (1 agent, git-only + read-only workspace)
    - ref: hermes/issue8-ship-odysseus
