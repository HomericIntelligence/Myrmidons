# Source of truth for all linting.
# CI runs `pre-commit run --all-files` via validate.yml.
# Do not add CI-only linters here.
repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]

  # Shell script linting — covers .sh, .bats, and hooks/pre-commit
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a23f6b85d0fdd5bb9d564e2579e678033debbdff  # v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning, --enable=SC2154]
        files: '\.(sh|bats)$|(^|/)pre-commit$'

  # GitHub Actions workflow linting — system-installed binary to support Go <1.16 hosts
  # See CLAUDE.md for installation instructions
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint-system

  # YAML linting — all YAML files across the repo
  - repo: https://github.com/adrienverge/yamllint
    rev: 81e9f98ffd059efe8aa9c1b1a42e5cce61b640c6  # v1.35.1
    hooks:
      - id: yamllint
        args: [-d, relaxed]
        files: '\.ya?ml$'

  # Secret scanning — uses system-installed gitleaks binary (avoids Go build)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false

  # Myrmidons dataset validators
  - repo: local
    hooks:
      - id: myrmidons-validate
        name: Myrmidons schema validation
        language: script
        entry: hooks/pre-commit
        types: [yaml]
        files: ^(agents|fleets)/.*\.yaml$
        pass_filenames: false

      - id: myrmidons-test-schema
        name: Myrmidons schema validation tests
        language: system
        entry: pixi run test-schema
        pass_filenames: false
        files: '^(agents|fleets|schemas|tests)/'

      - id: myrmidons-doc-drift
        name: Documentation drift check
        language: script
        entry: tests/detect-doc-drift.sh
        pass_filenames: false
        files: '(^(Architecture|README|CLAUDE|CONTRIBUTING)\.md$|^tests/detect-doc-drift\.sh$|^docs/(?!adr/).*\.md$)'

      - id: myrmidons-validate-fleet-refs
        name: Fleet ref validation
        language: system
        entry: tests/validate-fleet-refs.sh
        pass_filenames: false
        files: '^(agents|fleets)/.*\.ya?ml$'

      - id: myrmidons-schema-hints
        name: Myrmidons yaml-language-server hint check
        language: system
        entry: scripts/check-schema-hints.sh
        pass_filenames: true
        files: ^(agents|fleets)/.*\.ya?ml$

      - id: myrmidons-lint-agents-md
        name: AGENTS.md required sections
        language: script
        entry: scripts/lint-agents-md.sh
        files: ^AGENTS\.md$
        pass_filenames: false

      - id: forbid-or-true
        name: "forbid silent-failure workaround in shell/YAML/Dockerfile/justfile/HCL"
        description: >
          Rejects the `or-true` idiom (and its whitespace variants) in shell,
          YAML, Dockerfile, justfile, and HCL sources. Refactor to an explicit
          `if`-guard, a real conditional, or a documented `set +e`/`set -e`
          bracket. See HomericIntelligence/Odysseus#280.
        language: pygrep
        entry: '\|\|\s*true(\s*$|\s+#)'
        files: \.(sh|bash|yml|yaml|hcl)$|(^|/)Dockerfile[^/]*$|(^|/)[Jj]ustfile$
        types: [text]
        pass_filenames: true

      - id: forbid-continue-on-error
        name: "forbid continue-on-error workflow opt-out"
        description: >
          GitHub Actions `continue-on-error true` (truthy form) hides real CI
          failures. Fix the underlying job/step instead.
        language: pygrep
        entry: '^\s*continue-on-error:\s*true\s*$'
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: true

      - id: forbid-advisory-warnings
        name: "forbid advisory ::warning:: pattern in workflow run blocks"
        description: >
          The advisory-warning workflow annotation is morally equivalent to
          `continue-on-error: true` when it replaces a tool's failure exit
          with a benign-looking warning. The CI step still passes, the
          underlying problem still goes unfixed. Make the step fail-fast
          instead. The only legitimate use is annotating a step that runs
          BEFORE the failing tool (e.g., advising on a deprecated config),
          not wrapping the tool's own exit.
        language: pygrep
        entry: '::warning::'
        files: ^\.github/workflows/.*\.ya?ml$
        exclude: ^\.github/workflows/_required\.yml$
        pass_filenames: true
