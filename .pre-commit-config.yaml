# Source of truth for all linting.
# CI runs `pre-commit run --all-files` via validate.yml.
# Do not add CI-only linters here.
repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]

  # Shell script linting — covers .sh, .bats, and hooks/pre-commit
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: a23f6b85d0fdd5bb9d564e2579e678033debbdff  # v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning, --enable=SC2154]
        files: '\.(sh|bats)$|(^|/)pre-commit$'

  # GitHub Actions workflow linting — system-installed binary to support Go <1.16 hosts
  # See CLAUDE.md for installation instructions
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint-system

  # YAML linting — all YAML files across the repo
  - repo: https://github.com/adrienverge/yamllint
    rev: 81e9f98ffd059efe8aa9c1b1a42e5cce61b640c6  # v1.35.1
    hooks:
      - id: yamllint
        args: [-d, relaxed]
        files: '\.ya?ml$'

  # Secret scanning — uses system-installed gitleaks binary (avoids Go build)
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        pass_filenames: false

  # Myrmidons schema validation
  - repo: local
    hooks:
      - id: myrmidons-validate
        name: Myrmidons schema validation
        language: script
        entry: hooks/pre-commit
        types: [yaml]
        files: ^(agents|fleets)/.*\.yaml$
        pass_filenames: false

      - id: myrmidons-test-schema
        name: Myrmidons schema validation tests
        language: system
        entry: pixi run test-schema
        pass_filenames: false
        files: '^(agents|fleets|schemas|tests)/'

      - id: check-xtrace-exposure
        name: Check for unguarded xtrace auth exposure in curl calls
        language: script
        entry: scripts/check-xtrace-exposure.sh
        files: '\.sh$'
        pass_filenames: false

      - id: check-adr-index
        name: ADR README index completeness
        language: script
        entry: scripts/check-adr-index.sh
        pass_filenames: false
        files: ^docs/adr/.*\.md$

      - id: myrmidons-doc-drift
        name: Documentation drift check
        language: script
        entry: tests/detect-doc-drift.sh
        pass_filenames: false
        files: '(^(Architecture|README|CLAUDE|CONTRIBUTING)\.md$|^tests/detect-doc-drift\.sh$|^docs/(?!adr/).*\.md$)'

      - id: check-duplicate-functions
        name: Check for duplicate shell function definitions
        entry: scripts/check-duplicate-functions.sh
        language: script
        types: [shell]
        pass_filenames: false

      - id: myrmidons-validate-fleet-refs
        name: Fleet ref validation
        language: system
        entry: tests/validate-fleet-refs.sh
        pass_filenames: false
        files: '^(agents|fleets)/.*\.ya?ml$'

      - id: docs-crossref
        name: CLAUDE.md → AGENTS.md cross-reference check
        language: script
        entry: scripts/check-docs-crossref.sh
        files: '^(CLAUDE\.md|AGENTS\.md)$'
        pass_filenames: false
        # Trade-off: `files:` scopes incremental runs to CLAUDE.md/AGENTS.md changes, but
        # `pre-commit run --all-files` (used in CI parity) always triggers all hooks
        # regardless of file filters. The hook is fast (two greps), so the CI overhead is
        # acceptable. always_run is intentionally omitted (defaults to false).

      - id: myrmidons-schema-hints
        name: Myrmidons yaml-language-server hint check
        language: system
        entry: scripts/check-schema-hints.sh
        pass_filenames: true
        files: ^(agents|fleets)/.*\.ya?ml$

      - id: myrmidons-changelog-gaps
        name: Changelog gap detection
        language: python
        entry: python scripts/check-changelog-gaps.py
        pass_filenames: false
        always_run: true

      - id: myrmidons-lint-agents-md
        name: AGENTS.md required sections
        language: script
        entry: scripts/lint-agents-md.sh
        files: ^AGENTS\.md$
        pass_filenames: false

      - id: myrmidons-no-bare-read
        name: No bare read without timeout in scripts
        language: script
        entry: scripts/check-bare-read.sh
        types: [shell]
        files: '^scripts/.*\.sh$'
        pass_filenames: false
