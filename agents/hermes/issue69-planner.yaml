# yaml-language-server: $schema=../../schemas/agent-v1.schema.json
apiVersion: myrmidons/v1
kind: Agent
metadata:
  name: issue69-planner
  host: hermes
spec:
  label: "Issue 69 Planner"
  program: claude-code
  model: null
  workingDirectory: /home/mvillmow/Odysseus
  programArgs: ""
  taskDescription: >-
    Plans always-approve-reads permission merge across Odysseus + 14 submodule
    repos. Reads gist canonical list, diffs each .claude/settings.json,
    produces per-repo patch plan.
  tags:
    - issue-69
    - planner
    - multi-repo
    - claude-permissions
  owner: mvillmow
  role: member
  deployment:
    type: docker
    docker:
      image: achaean-claude:latest
      cpus: 2
      memory: 4g
  desiredState: active
