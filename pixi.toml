[project]
name = "myrmidons"
version = "0.1.0"
description = "GitOps agent provisioning for the HomericIntelligence mesh"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
just = ">=1.13"
jq   = ">=1.6"
# yq (go-based, https://github.com/mikefarah/yq) is not available in conda-forge.
# Install manually: see scripts/lib/reconcile.sh or CI workflows.

[tasks]
status   = "just status"
plan     = "just plan"
apply    = "just apply"
validate = "just validate"
export   = "just export"
