[workspace]
name = "myrmidons"
version = "0.1.0"
description = "GitOps agent provisioning for the HomericIntelligence mesh"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

[dependencies]
just      = ">=1.13"
jq        = ">=1.6"
go-yq     = ">=4.40,<5"

[target.linux-64.dependencies]
bats-core = ">=1.11,<2"

[target.osx-arm64.dependencies]
bats-core = ">=1.11,<2"

[target.osx-64.dependencies]
bats-core = ">=1.11,<2"
curl      = ">=8.0"

[feature.lint.dependencies]
shellcheck = "0.10.0.*"
yamllint   = ">=1.35,<2"
pre-commit = ">=3.0,<5"

[feature.cpp.dependencies]
cmake        = ">=3.20"
ninja        = ">=1.11"
cxx-compiler = ">=1.0"

[feature.cpp.tasks]
build-hello-world = "just build-hello-world"

[environments]
default = { solve-group = "default" }
lint    = { features = ["lint"], solve-group = "lint" }
cpp     = { features = ["cpp"], solve-group = "default" }

[tasks]
status        = "just status"
plan          = "just plan"
apply         = "just apply"
validate      = "just validate"
export        = "just export"
lint-names    = "bash scripts/lint-names.sh"
lint-shell    = "bash scripts/lint-shell.sh"

test-unit        = "bats tests/unit/"
test-integration = "bats tests/integration/"
test-schema      = "./tests/validate-schemas.sh"
test-doc-drift   = "./tests/detect-doc-drift.sh"
test-api-retry   = "./tests/test-api-retry.sh"
test-rollback    = "./tests/test-rollback.sh"
test-xtrace      = "bash tests/test-check-xtrace-guards.sh"
test-standalone  = { depends-on = ["test-api-retry", "test-rollback"] }
test             = { depends-on = ["test-unit", "test-schema", "test-doc-drift", "test-standalone", "test-xtrace"] }
build-hello-world = "just build-hello-world"

[feature.lint.tasks]
lint-shell = { cmd = "find scripts tests hooks \\( -name '*.sh' -o -name '*.bats' -o -name 'pre-commit' \\) | sort | xargs shellcheck --severity=warning --enable=SC2154", description = "ShellCheck all shell scripts and bats tests at warning severity" }
lint       = { depends-on = ["lint-shell"] }
