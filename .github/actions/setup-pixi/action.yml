name: Set Up Pixi Environment
description: Install pixi and cache rattler + .pixi. Wraps prefix-dev/setup-pixi.

inputs:
  environment:
    description: 'Pixi environment to install (default, lint)'
    required: false
    default: 'default'

runs:
  using: composite
  steps:
    - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e  # v0.9.4
      with:
        pixi-version: v0.67.2
        environments: ${{ inputs.environment }}
        cache: true

    - name: Add pixi env tools to PATH
      shell: bash
      run: |
        env_bin=".pixi/envs/${{ inputs.environment }}/bin"
        if [[ -d "$env_bin" ]]; then
          echo "$(pwd)/${env_bin}" >> "$GITHUB_PATH"
        fi
