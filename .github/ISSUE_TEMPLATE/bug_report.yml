name: Bug Report
description: Something is broken or behaving incorrectly
title: "[Bug] "
labels:
  - "kind: bug"
  - "status: needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Please fill in all sections below to help diagnose the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run `just validate`
        2. Observe error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include any error output.
    validations:
      required: true

  - type: input
    id: agamemnon-version
    attributes:
      label: Agamemnon Version
      placeholder: e.g. 1.2.3

  - type: input
    id: host
    attributes:
      label: Host
      placeholder: e.g. hermes

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Ubuntu 22.04
