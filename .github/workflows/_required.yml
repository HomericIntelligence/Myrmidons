name: Required Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: required-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  TV_VER: "0.70.0"

jobs:
  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: "Reject silent-failure workaround in shell/YAML/Dockerfile/justfile/HCL"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            -- \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.hcl' \
            'Dockerfile*' '**/Dockerfile*' \
            'justfile' '**/justfile' 'Justfile' '**/Justfile')
          declare -a scan_files=()
          for f in "${files[@]}"; do
            case "$f" in
              # Exempt this workflow file (heredoc would otherwise self-match)
              .github/workflows/_required.yml) continue ;;
              # Exempt any runbook that documents the rule (if present)
              docs/runbooks/no-silent-failures.md) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nE '\|\|[[:space:]]*true([[:space:]]*$|[[:space:]]+#)' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found silent-failure workarounds above. Refactor per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no silent-failure workarounds found'

      - name: "Reject continue-on-error workflow opt-out"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No workflow files"
            exit 0
          fi
          if grep -nE '^[[:space:]]*continue-on-error:[[:space:]]*true[[:space:]]*$' "${files[@]}"; then
            echo ""
            echo '::error::Found "continue-on-error: true" above. Fix the root cause per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no "continue-on-error: true" found'

      - name: "Reject advisory annotation pattern"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          # The advisory-annotation pattern in workflow run blocks is morally
          # equivalent to continue-on-error: true: it lets a tool fail without
          # failing the CI step. The runbook (Bucket F) requires every tool
          # to be fail-fast. The only legitimate annotation is informational
          # text not tied to a tool's exit code — those should use
          # echo "WARN:" to stdout instead. See docs/runbooks/no-silent-failures.md.
          declare -a scan_files=()
          for f in "${files[@]}"; do
            # Exempt this workflow file (heredoc would otherwise self-match).
            case "$f" in
              .github/workflows/_required.yml) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nF '::warning::' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found advisory annotations above. Make the underlying tool fail-fast or use echo "WARN:" to stdout. See docs/runbooks/no-silent-failures.md Bucket F.'
            exit 1
          fi
          echo 'OK: no advisory annotations found'

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: ./.github/actions/setup-pixi
        with:
          environment: lint

      # ShellCheck on all .sh files via pixi lint task
      - name: Run shellcheck (pixi lint-shell)
        run: pixi run --environment lint lint-shell

      # yamllint on agent YAML definitions
      - name: Install yamllint
        run: pip install --quiet yamllint

      - name: yamllint agent definitions
        run: yamllint -d relaxed agents/

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: ./.github/actions/setup-pixi

      - name: Run unit tests (bats)
        run: pixi run test-unit

  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      # pip-audit: scan Python dependencies for known vulnerabilities.
      # Fail-fast on findings — if pip-audit reports a CVE, bump the offending
      # dep or add an entry to the allowlist with a tracked-issue reference
      # before merging. No advisory mode. See docs/runbooks/no-silent-failures.md
      # Bucket F.
      #
      # Baseline review schedule: 2026-08-08 (see #713)
      #
      # The --ignore-vuln allowlist below is the runner-image baseline captured
      # in issue #713 against the `ubuntu-latest` baseline Python packages
      # (certifi, configobj, cryptography, idna, jinja2, pip, pyasn1, pygments,
      # pyjwt, pyopenssl, requests, setuptools, twisted, urllib3, wheel).
      # Myrmidons declares zero PyPI dependencies, so these CVEs come from the
      # GitHub runner image, not our source tree.
      #
      # On 2026-08-08 (or sooner if `actions/runner-images` ships a refresh):
      #   1. Re-run pip-audit WITHOUT --ignore-vuln on a fresh runner.
      #   2. Prune any IDs below that are no longer reported (drop the line).
      #   3. If NEW IDs appear, open a follow-up issue rather than blind-adding.
      #   4. Bump this review-marker date or close #713 if the list is empty.
      #
      # Each ID below is tracked by issue #713; the consolidated marker above
      # is intentional (per-line tracking refs were tried in earlier iterations
      # but break shell line-continuation with inline `# comment \` syntax).
      #
      # 2026-06-29: GHSA-537c-gmf6-5ccf newly surfaced on the same runner-image
      # `cryptography 41.0.7` baseline package (statically-linked OpenSSL OOB
      # read in pyca/cryptography wheels < 48.0.1). Myrmidons pins no PyPI deps,
      # so this is a runner-image baseline CVE like the rest — allowlisted here
      # and folded into the #713 baseline review. Surfaced by #747.
      - name: pip-audit
        run: |
          set -euo pipefail
          pip install --quiet pip-audit
          pip-audit \
            --ignore-vuln PYSEC-2024-230 \
            --ignore-vuln CVE-2023-26112 \
            --ignore-vuln PYSEC-2024-225 \
            --ignore-vuln CVE-2023-50782 \
            --ignore-vuln CVE-2024-0727 \
            --ignore-vuln GHSA-h4gh-qq45-vh27 \
            --ignore-vuln CVE-2026-26007 \
            --ignore-vuln CVE-2026-34073 \
            --ignore-vuln GHSA-537c-gmf6-5ccf \
            --ignore-vuln PYSEC-2024-60 \
            --ignore-vuln CVE-2024-22195 \
            --ignore-vuln CVE-2024-34064 \
            --ignore-vuln CVE-2024-56326 \
            --ignore-vuln CVE-2024-56201 \
            --ignore-vuln CVE-2025-27516 \
            --ignore-vuln CVE-2025-8869 \
            --ignore-vuln CVE-2026-1703 \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-6357 \
            --ignore-vuln CVE-2026-30922 \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln CVE-2026-32597 \
            --ignore-vuln CVE-2026-27448 \
            --ignore-vuln CVE-2026-27459 \
            --ignore-vuln CVE-2024-35195 \
            --ignore-vuln CVE-2024-47081 \
            --ignore-vuln CVE-2026-25645 \
            --ignore-vuln PYSEC-2025-49 \
            --ignore-vuln CVE-2024-6345 \
            --ignore-vuln PYSEC-2024-75 \
            --ignore-vuln CVE-2024-41671 \
            --ignore-vuln CVE-2026-42304 \
            --ignore-vuln CVE-2024-37891 \
            --ignore-vuln CVE-2025-50181 \
            --ignore-vuln CVE-2025-66418 \
            --ignore-vuln CVE-2025-66471 \
            --ignore-vuln CVE-2026-21441 \
            --ignore-vuln CVE-2026-24049 \
            --ignore-vuln CVE-2026-44431 \
            --ignore-vuln CVE-2026-45409 \
            --ignore-vuln PYSEC-2026-196 \
            --ignore-vuln PYSEC-2025-183 \
            --ignore-vuln PYSEC-2026-179 \
            --ignore-vuln PYSEC-2026-175 \
            --ignore-vuln PYSEC-2026-177  # idna/pip/pyjwt runner-image baseline (#713)

      # Trivy filesystem scan — informational. `--exit-code 0` already makes
      # vulnerability findings non-fatal; install/extraction failures should
      # still fail the step so we know when the scan stopped working.
      - name: Trivy filesystem scan
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download"
          curl -sSfL \
            "${base}/v${{ env.TV_VER }}/trivy_${{ env.TV_VER }}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy fs --severity HIGH,CRITICAL --exit-code 0 .

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          fetch-depth: 0

      # Use the unlicensed gitleaks binary — no GITLEAKS_LICENSE required.
      - name: Install gitleaks
        run: |
          url="https://github.com/gitleaks/gitleaks/releases/download"
          curl -sSfL \
            "${url}/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets (gitleaks)
        run: gitleaks detect --source . --config .gitleaks.toml --no-git -v

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      # Validate all agent YAML files parse and conform to schema
      - name: Install pyyaml and jsonschema
        run: pip install --quiet pyyaml jsonschema

      - name: Validate agent YAML definitions
        run: |
          python - <<'EOF'
          import yaml, glob, json, jsonschema, sys

          schema_path = "schemas/agent-v1.schema.json"
          with open(schema_path) as f:
              schema = json.load(f)

          agent_files = glob.glob("agents/**/*.yaml", recursive=True)
          errors = []
          for filepath in sorted(agent_files):
              with open(filepath) as f:
                  try:
                      doc = yaml.safe_load(f)
                  except yaml.YAMLError as e:
                      errors.append(f"YAML parse error in {filepath}: {e}")
                      continue
              try:
                  jsonschema.validate(doc, schema)
              except jsonschema.ValidationError as e:
                  errors.append(f"Schema error in {filepath}: {e.message}")

          if errors:
              for err in errors:
                  print(f"ERROR: {err}", file=sys.stderr)
              sys.exit(1)

          print(f"Validated {len(agent_files)} agent definitions — all OK.")
          EOF

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install mypy
        run: pip install --quiet mypy

      # Run mypy on Python scripts if any exist; fall back to py_compile check
      - name: mypy / py_compile on Python files
        run: |
          PY_FILES=$(find . -name "*.py" \
            -not -path "*/.git/*" \
            -not -path "*/__pycache__/*")
          if [ -z "$PY_FILES" ]; then
            echo "No Python files found — skipping mypy."
            exit 0
          fi
          # Attempt mypy on scripts/ if it exists. Surface type errors as a
          # workflow warning rather than failing the job (mypy on a partial
          # codebase produces noisy results), but log the actual rc so it is
          # visible in the build summary.
          if [ -d "scripts" ] && find scripts -name "*.py" | grep -q .; then
            mypy_rc=0
            mypy --ignore-missing-imports scripts/ || mypy_rc=$?
            if [ "$mypy_rc" -ne 0 ]; then
              echo "::warning::mypy on scripts/ exited $mypy_rc — review the output above."
            fi
          fi
          # Always run py_compile as a hard syntax check
          echo "$PY_FILES" | head -20 | xargs python -m py_compile
          echo "py_compile passed on all Python files."

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: ./.github/actions/setup-pixi
        with:
          environment: lint

      # Validate workflow YAML files are well-formed (yq, already in pixi env)
      - name: Lint workflow YAML files (yq)
        run: |
          find .github/workflows -name '*.yml' | sort | while read -r f; do
            echo "  checking: $f"
            yq eval '.' "$f" > /dev/null
          done
          echo "All workflow YAML files are well-formed."

      # Validate GitHub workflow schema via check-jsonschema
      - name: Install check-jsonschema
        run: pip install --quiet check-jsonschema

      - name: Validate GitHub workflow schemas
        run: |
          mapfile -t workflow_files < <(find .github/workflows -name '*.yml' | sort)
          # Retry up to 3 times to handle transient schemastore.org 503s
          for attempt in 1 2 3; do
            check-jsonschema \
              --schemafile https://json.schemastore.org/github-workflow \
              "${workflow_files[@]}" && break
            echo "::warning::Schema validation attempt $attempt failed; retrying in 15s..."
            sleep 15
          done

      # Validate pixi.toml is parseable TOML
      - name: Validate pixi.toml
        run: |
          python - <<'EOF'
          import tomllib
          with open("pixi.toml", "rb") as f:
              data = tomllib.load(f)
          name = (data.get('workspace', {}).get('name')
                  or data.get('project', {}).get('name', 'unknown'))
          print(f"pixi.toml OK — workspace: {name}")
          EOF

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: ./.github/actions/setup-pixi

      # Verify pixi.lock matches pixi.toml — exits non-zero if lock is stale
      - name: Install dependencies (locked)
        run: pixi install --locked

  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: ./.github/actions/setup-pixi

      # Canonical `install` check (Odysseus ecosystem CI-naming, issue #750).
      # The "artifact" this dataset repo ships to developers and CI is the
      # pixi-managed validator toolchain plus the git hooks. Verify both
      # environments install from the lockfile, every pinned tool executes,
      # and the documented developer install path (just install-hooks) works.
      - name: Install default environment (locked)
        run: pixi install --locked

      - name: Install lint environment (locked)
        run: pixi install --locked --environment lint

      - name: Smoke-test installed toolchain
        run: |
          set -euo pipefail
          pixi run -- just --version
          pixi run -- jq --version
          pixi run -- yq --version
          pixi run -- bats --version
          pixi run --environment lint -- shellcheck --version
          pixi run --environment lint -- yamllint --version
          pixi run --environment lint -- pre-commit --version

      - name: Install git hooks (just install-hooks)
        run: pixi run -- just install-hooks
