name: Required Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: required-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.3"
  TV_VER: "0.70.0"

jobs:
  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: "Reject silent-failure workaround in shell/YAML/Dockerfile/justfile/HCL"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            -- \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.hcl' \
            'Dockerfile*' '**/Dockerfile*' \
            'justfile' '**/justfile' 'Justfile' '**/Justfile')
          declare -a scan_files=()
          for f in "${files[@]}"; do
            case "$f" in
              # Exempt this workflow file (heredoc would otherwise self-match)
              .github/workflows/_required.yml) continue ;;
              # Exempt any runbook that documents the rule (if present)
              docs/runbooks/no-silent-failures.md) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nE '\|\|[[:space:]]*true([[:space:]]*$|[[:space:]]+#)' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found silent-failure workarounds above. Refactor per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no silent-failure workarounds found'

      - name: "Reject continue-on-error workflow opt-out"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No workflow files"
            exit 0
          fi
          if grep -nE '^[[:space:]]*continue-on-error:[[:space:]]*true[[:space:]]*$' "${files[@]}"; then
            echo ""
            echo '::error::Found "continue-on-error: true" above. Fix the root cause per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no "continue-on-error: true" found'

      - name: "Reject advisory annotation pattern"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          # The advisory-annotation pattern in workflow run blocks is morally
          # equivalent to continue-on-error: true: it lets a tool fail without
          # failing the CI step. The runbook (Bucket F) requires every tool
          # to be fail-fast. The only legitimate annotation is informational
          # text not tied to a tool's exit code — those should use
          # echo "WARN:" to stdout instead. See docs/runbooks/no-silent-failures.md.
          declare -a scan_files=()
          for f in "${files[@]}"; do
            # Exempt this workflow file (heredoc would otherwise self-match).
            case "$f" in
              .github/workflows/_required.yml) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nF '::warning::' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found advisory annotations above. Make the underlying tool fail-fast or use echo "WARN:" to stdout. See docs/runbooks/no-silent-failures.md Bucket F.'
            exit 1
          fi
          echo 'OK: no advisory annotations found'

  # ---------------------------------------------------------------------------
  # Containerized jobs: the toolchain is baked into the CI image
  # (ci/Containerfile) and every check runs inside a podman container.
  # scripts/run_ci_local.sh auto-detects podman on the runner.
  # ---------------------------------------------------------------------------

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-myrmidons-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-myrmidons-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t myrmidons-ci:local .

      - name: Run shellcheck (just lint-shell) + yamllint (in container)
        run: ./scripts/run_ci_local.sh lint

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-myrmidons-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-myrmidons-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t myrmidons-ci:local .

      - name: Run unit tests (bats) (in container)
        run: ./scripts/run_ci_local.sh test

  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-myrmidons-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-myrmidons-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t myrmidons-ci:local .

      # pip-audit: scan Python dependencies for known vulnerabilities.
      # Fail-fast on findings — if pip-audit reports a CVE, bump the offending
      # dep or add an entry to the allowlist with a tracked-issue reference
      # before merging. No advisory mode. See docs/runbooks/no-silent-failures.md
      # Bucket F.
      #
      # Baseline review schedule: 2026-08-08 (see #713)
      #
      # The --ignore-vuln allowlist below is the runner-image baseline captured
      # in issue #713 against the `ubuntu-latest` baseline Python packages
      # (certifi, configobj, cryptography, idna, jinja2, pip, pyasn1, pygments,
      # pyjwt, pyopenssl, requests, setuptools, twisted, urllib3, wheel).
      # Myrmidons declares zero PyPI dependencies, so these CVEs come from the
      # GitHub runner image, not our source tree.
      #
      # On 2026-08-08 (or sooner if `actions/runner-images` ships a refresh):
      #   1. Re-run pip-audit WITHOUT --ignore-vuln on a fresh runner.
      #   2. Prune any IDs below that are no longer reported (drop the line).
      #   3. If NEW IDs appear, open a follow-up issue rather than blind-adding.
      #   4. Bump this review-marker date or close #713 if the list is empty.
      #
      # Each ID below is tracked by issue #713; the consolidated marker above
      # is intentional (per-line tracking refs were tried in earlier iterations
      # but break shell line-continuation with inline `# comment \` syntax).
      #
      # 2026-06-29: GHSA-537c-gmf6-5ccf newly surfaced on the same runner-image
      # `cryptography 41.0.7` baseline package (statically-linked OpenSSL OOB
      # read in pyca/cryptography wheels < 48.0.1). Myrmidons pins no PyPI deps,
      # so this is a runner-image baseline CVE like the rest — allowlisted here
      # and folded into the #713 baseline review. Surfaced by #747.
      #
      # 2026-07-14: PYSEC-2026-2132 newly surfaced on the runner-image
      # `click 8.1.6` baseline package (fixed in click 8.3.3). Myrmidons pins
      # no PyPI deps — click is not in pyproject.toml/uv.lock — so this is a
      # runner-image baseline CVE like the rest: allowlisted here and folded
      # into the #713 baseline review. Tracked by #762.
      #
      # 2026-07-16: PYSEC-2026-3444 (httplib2 0.20.4, fixed in 0.32.0) and
      # PYSEC-2026-3447 (setuptools 68.1.2, fixed in 83.0.0) newly surfaced on
      # the same runner-image baseline. Both packages ship with the
      # `ubuntu-latest` image system Python — Myrmidons pins no PyPI deps —
      # so these are runner-image baseline CVEs like the rest: allowlisted
      # here and folded into the #713 baseline review. Surfaced by #763.
      - name: pip-audit + trivy (in container)
        run: ./scripts/run_ci_local.sh security

  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-myrmidons-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-myrmidons-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t myrmidons-ci:local .

      # gitleaks is baked into the CI image (pinned release).
      - name: Scan for secrets (gitleaks) (in container)
        run: podman run --rm -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 myrmidons-ci:local gitleaks detect --source /workspace --config .gitleaks.toml --no-git -v

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-myrmidons-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-myrmidons-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t myrmidons-ci:local .

      # Validate all agent YAML files parse and conform to schema.
      # pyyaml + jsonschema are baked into the CI image's uv environment.
      - name: Validate agent YAML definitions (in container)
        run: podman run --rm -v "$PWD:/workspace:Z" --userns=keep-id:uid=1000,gid=1000 myrmidons-ci:local uv run --frozen python scripts/validate-agent-schemas.py

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only package a schema-valid dataset — build is the agent-YAML schema gate.
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-myrmidons-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-myrmidons-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t myrmidons-ci:local .

      # The distributable for a dataset repo is the dataset itself: a
      # reproducible tar.gz of agents/ + fleets/ + schemas/ with a checksum.
      # See Odysseus docs/ci-naming-convention.md ("package" = release archive).
      - name: Build dataset release archive + verify round-trip (in container)
        run: ./scripts/run_ci_local.sh package

      - name: Upload dataset artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: myrmidons-dataset
          path: dist/
          if-no-files-found: error
          retention-days: 14

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-myrmidons-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-myrmidons-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t myrmidons-ci:local .

      # Run mypy on Python scripts if any exist; fall back to py_compile check
      - name: mypy / py_compile on Python files (in container)
        run: ./scripts/run_ci_local.sh typecheck

  schema-validation:
    name: schema-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-myrmidons-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-myrmidons-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t myrmidons-ci:local .

      # Validate workflow YAML files, GitHub workflow schemas, and pyproject.toml
      # (yq + check-jsonschema + Python are baked into the CI image)
      - name: Validate workflows + pyproject (in container)
        run: ./scripts/run_ci_local.sh schema

  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-myrmidons-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-myrmidons-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t myrmidons-ci:local .

      # Verify uv.lock matches pyproject.toml and the locked environment installs
      # cleanly — inside the container.
      - name: Verify lockfile sync + locked install (in container)
        run: ./scripts/run_ci_local.sh deps

  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.local/share/containers/storage
          key: podman-myrmidons-${{ runner.os }}-${{ hashFiles('uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-myrmidons-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t myrmidons-ci:local .

      # Canonical `install` check (Odysseus ecosystem CI-naming, issue #750).
      # The "artifact" this dataset repo ships to developers and CI is the
      # validator toolchain (just/jq/go-yq/bats/shellcheck plus the uv-managed
      # Python tools) and the git hooks. Verify every pinned tool executes and
      # the documented developer install path (just install-hooks) works —
      # inside the container.
      - name: Smoke-test installed toolchain + hooks (in container)
        run: ./scripts/run_ci_local.sh install
