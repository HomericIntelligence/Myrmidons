name: Validate Agent YAML Schemas

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/**'
      - 'fleets/**'
      - 'scripts/**'
      - 'hooks/**'
      - '.github/workflows/**'
      - 'schemas/**'
      - '.myrmidons.yaml'
      - '.pre-commit-config.yaml'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'tests/**'
      - 'docs/adr/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Single source-of-truth lint job: runs every hook in .pre-commit-config.yaml.
  # Adding a linter? Add it to .pre-commit-config.yaml — it auto-runs here.
  # Do not add CI-only linters outside pre-commit.
  pre-commit:
    name: Pre-commit (parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pixi
        with:
          environment: lint

      - name: Run pre-commit on all files
        run: |
          pixi run --environment lint pre-commit run \
            --all-files --show-diff-on-failure

  validate:
    name: Validate YAML Schemas
    runs-on: ubuntu-latest
    needs: [pre-commit]
    timeout-minutes: 10
    # AGAMEMNON_API_KEY: if scripts need authenticated Agamemnon API calls,
    # set this as a GitHub Actions secret and pass it here:
    #   env:
    #     AGAMEMNON_API_KEY: ${{ secrets.AGAMEMNON_API_KEY }}
    # The validate job currently runs schema checks only and does not call the
    # Agamemnon API, so the secret is not wired in by default. (#223)
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pixi

      - name: Check dependencies
        run: |
          echo "--- Checking required tools ---"
          yq --version
          jq --version
          bash --version | head -1
          echo "All required dependencies present."

      - name: Lint workflow YAML files
        run: |
          echo "--- Validating workflow YAML files ---"
          find .github/workflows -name '*.yml' | sort | while read -r f; do
            echo "  checking: $f"
            yq eval '.' "$f" > /dev/null
          done
          echo "All workflow YAML files are well-formed."

      - name: Validate all YAML files
        env:
          CI: "true"
        run: pixi run test-schema

  doctor:
    name: Doctor — Dependency Check
    runs-on: ubuntu-latest
    needs: [pre-commit]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pixi

      - name: Run doctor (deps only, skip connectivity + hooks)
        run: |
          chmod +x scripts/doctor.sh
          # In CI there is no real Agamemnon endpoint or installed git hooks;
          # skip both. Doctor still validates tools, YAML, and pixi env.
          pixi run bash scripts/doctor.sh --skip-connectivity --skip-hooks
