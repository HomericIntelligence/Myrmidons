name: Validate Agent YAML Schemas

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/**'
      - 'fleets/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'pixi.toml'
      - 'pixi.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: "v0.10.0"
        run: |
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ --strip-components=1 -C /usr/local/bin \
                "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          shellcheck --version

      - name: Run shellcheck
        run: |
          find scripts tests hooks -name '*.sh' -o -name 'pre-commit' 2>/dev/null \
            | sort \
            | xargs shellcheck --severity=warning

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin actionlint
          actionlint --version

      - name: Run actionlint
        run: actionlint

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Validate YAML Schemas
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 10
    # AGAMEMNON_API_KEY: if scripts exercised during validation make authenticated
    # API calls, set this as a GitHub Actions secret and pass it here:
    #   env:
    #     AGAMEMNON_API_KEY: ${{ secrets.AGAMEMNON_API_KEY }}
    # The validate job currently runs schema checks only and does not call the
    # Agamemnon API, so the secret is not wired in by default. (#223)
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-pixi

      - name: Validate all YAML files
        env:
          CI: "true"
        run: pixi run test-schema
