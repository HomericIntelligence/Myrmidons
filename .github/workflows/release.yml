name: Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Package the dataset snapshot. On tag pushes the version is the tag
      # name (shallow checkout has no tags for git describe); otherwise the
      # script derives snapshot-<shortsha>.
      - name: Package dataset snapshot
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            bash scripts/package-dataset.sh "${GITHUB_REF_NAME}"
          else
            bash scripts/package-dataset.sh
          fi

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: myrmidons-dataset
          path: dist/myrmidons-dataset-*.tar.gz
          if-no-files-found: error

  # Tag-gated publisher — the ONLY job holding a write token. PR- and
  # main-triggered runs (which execute PR-head code above) stay read-only.
  # Re-runs the packaging script instead of downloading the artifact: output
  # is deterministic per commit (RELEASE_INFO date is the commit date), and
  # this avoids a second third-party action pin.
  publish-release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Package dataset snapshot (tag version)
        run: |
          set -euo pipefail
          bash scripts/package-dataset.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/myrmidons-dataset-*.tar.gz \
            --title "Myrmidons dataset ${GITHUB_REF_NAME}" \
            --notes "Versioned dataset snapshot (agents/, fleets/, schemas/). See RELEASE_INFO inside the archive."
