name: Apply Agent Definitions

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'fleets/**'
      - 'pixi.toml'
      - 'pixi.lock'

jobs:
  apply:
    name: Reconcile Desired State
    runs-on: ubuntu-latest
    env:
      AGAMEMNON_URL: ${{ secrets.AGAMEMNON_URL }}
      AGAMEMNON_API_KEY: ${{ secrets.AGAMEMNON_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache pixi environment
        uses: actions/cache@v4
        with:
          path: |
            .pixi
            ~/.cache/rattler/cache
          key: pixi-${{ runner.os }}-${{ hashFiles('pixi.lock') }}

      - name: Install dependencies (locked)
        run: pixi install --locked

      - name: Install yq
        env:
          YQ_VERSION: "v4.40.5"
        run: |
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Plan — show what will change
        run: |
          chmod +x scripts/plan.sh scripts/lib/api.sh scripts/lib/reconcile.sh
          ./scripts/plan.sh || true

      - name: Apply — reconcile desired state
        run: |
          chmod +x scripts/apply.sh
          ./scripts/apply.sh

      - name: Status — verify no drift remains
        run: |
          chmod +x scripts/status.sh
          ./scripts/status.sh
