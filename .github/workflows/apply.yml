name: Apply Agent Definitions

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'fleets/**'

jobs:
  apply:
    name: Reconcile Desired State
    runs-on: ubuntu-latest
    env:
      AGAMEMNON_URL: ${{ secrets.AGAMEMNON_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Install yq
        env:
          YQ_VERSION: "v4.40.5"
        run: |
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version

      - name: Install jq if needed
        run: |
          if ! command -v jq &>/dev/null; then
            apt-get install -y jq
          fi
          jq --version

      - name: Plan — show what will change
        run: |
          chmod +x scripts/plan.sh scripts/lib/api.sh scripts/lib/reconcile.sh
          ./scripts/plan.sh || true

      - name: Apply — reconcile desired state
        run: |
          chmod +x scripts/apply.sh
          ./scripts/apply.sh

      - name: Status — verify no drift remains
        run: |
          chmod +x scripts/status.sh
          ./scripts/status.sh
